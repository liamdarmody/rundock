          // Runs a system tool as root.
          function rootRun(argv, input = '') {
            return require('node:child_process').spawnSync(SUDO, ['-n', ...argv], { argv0: 'sudo', input, stdio: ['pipe', 'pipe', 'pipe'], maxBuffer: LIMIT });
          }
          // Runs a system tool as root, and throws unless it exits 0.
          function asRoot(argv, input = '') {
            const r = rootRun(argv, input);
            if (r.error || r.status !== 0) {
              throw new Error(`sudo -n ${argv.join(' ')} failed: ${JSON.stringify(String(r.error ? r.error.code : r.stderr).trim())}`);
            }
            return r;
          }
          // Whether anything, a dangling symlink included, is at the path.
          function exists(p) {
            try {
              require('node:fs').lstatSync(p);
              return true;
            } catch (e) {
              return false;
            }
          }
          // Prints a child's output whole, ending on a new line.
          function show(bytes) {
            if (!bytes || !bytes.length) return;
            process.stdout.write(bytes);
            if (bytes[bytes.length - 1] !== 0x0a) process.stdout.write('\n');
          }
          // end test user
          // Why the test user left something running or scheduled, or a run's exit
          // status disagrees with its TAP, or null.
          function stopTestUser(env) {
            const fs = require('node:fs');
            const path = require('node:path');
            const user = testUser();
            const left = killAndCheck(user);
            if (left) return left;
            // Cron reads a user's crontab from the entry in its spool named
            // exactly after the user, whatever its type. crontab -l refuses a
            // user in cron.deny even to root, so the spool is listed instead,
            // as root, each name ended by 0x00 and compared byte for byte.
            if (exists('/usr/bin/crontab')) {
              const spool = '/var/spool/cron/crontabs';
              const r = rootRun(['/usr/bin/find', spool, '-mindepth', '1', '-maxdepth', '1', '-printf', '%f\\0']);
              const cause = r.error ? `spawn error ${r.error.code || r.error.message}` : r.signal ? `signal ${r.signal}` : r.status !== 0 ? `exit status ${r.status}` : null;
              if (cause) return `cron's spool ${JSON.stringify(spool)} cannot be listed as root (${cause}): ${JSON.stringify(String(r.stderr || '').trim())}`;
              const names = nulFields(r.stdout);
              if ((r.stdout.length && r.stdout[r.stdout.length - 1] !== 0) || names.some((name) => !name.length)) {
                return `cron's spool ${JSON.stringify(spool)} lists a name that cannot be read: ${showBytes(r.stdout)}`;
              }
              if (names.some((name) => name.equals(Buffer.from(TEST_USER)))) return `the test user has a crontab, ${JSON.stringify(path.join(spool, TEST_USER))}`;
            }
            if (exists('/usr/bin/atq')) {
              const jobs = String(asRoot(['/usr/bin/atq']).stdout).split('\n').filter((line) => line.trim().split(/\s+/).pop() === TEST_USER);
              if (jobs.length) return `the test user has an at job: ${JSON.stringify(jobs[0])}`;
            }
            const linger = path.join('/var/lib/systemd/linger', TEST_USER);
            try {
              fs.lstatSync(linger);
              return `the test user has a linger file, ${JSON.stringify(linger)}`;
            } catch (e) {
              if (e.code !== 'ENOENT') return `${JSON.stringify(linger)} cannot be read (${e.code || e.message})`;
            }
            const test = testFor(env.SIDE, env.ENTRY, JSON.parse(env.TESTS), JSON.parse(env.ROWS));
            const dir = path.join(env.RUNNER_TEMP, 'prove-evidence');
            for (let n = 1; n <= 3; n++) {
              const exit = JSON.parse(fs.readFileSync(path.join(dir, `exit-${n}.json`), 'utf8'));
              const result = outcome(fs.readFileSync(path.join(dir, `run-${n}.tap`), 'utf8'), test.name, test.file);
              if (exit.signal !== null) return `run ${n} was ended by ${exit.signal}`;
              if (result === 'passed' && exit.status !== 0) return `run ${n} is passed in its TAP, but exited with status ${exit.status}, not 0`;
              if (result === 'assertion failed' && exit.status !== 1) return `run ${n} is assertion failed in its TAP, but exited with status ${exit.status}, not 1`;
            }
            return null;
          }
          const env = process.env;
          let why;
          try {
            why = stopTestUser(env);
          } catch (e) {
            why = e.message;
          }
          if (why) {
            process.stderr.write(`stop the test user failed: ${why}\n`);
            process.exit(1);
          }
          process.stdout.write("the test user left nothing behind, and each run's exit status agrees with its TAP\n");

      - name: check the tree
        shell: node {0}
        run: &check-the-tree-run |
          'use strict';
          // begin bytes
          // Names read as bytes are decoded strictly: a byte that is not part of
          // well-formed UTF-8 is never read as U+FFFD, so a name holding byte 0xFF
          // never equals one holding a real U+FFFD. A leading byte order mark is kept.
          const DECODE = { fatal: true, ignoreBOM: true };
          // The text the bytes spell, or null when they are not well-formed UTF-8.
          function decoded(bytes) {
            try {
              return new TextDecoder('utf-8', DECODE).decode(bytes);
            } catch (e) {
              return null;
            }
          }
          // The bytes as a JSON string, each byte that does not decode written \xHH.
          function showBytes(bytes) {
            let out = '';
            for (let at = 0; at < bytes.length;) {
              const width = [1, 2, 3, 4].find((w) => at + w <= bytes.length && decoded(bytes.subarray(at, at + w)) !== null);
              out += width ? JSON.stringify(decoded(bytes.subarray(at, at + width))).slice(1, -1) : `\\x${bytes[at].toString(16).toUpperCase().padStart(2, '0')}`;
              at += width || 1;
            }
            return `"${out}"`;
          }
          // The bytes split on 0x00, without the empty field after a final 0x00.
          function nulFields(bytes) {
            const out = [];
            for (let at = 0; at < bytes.length;) {
              const end = bytes.indexOf(0, at);
              out.push(bytes.subarray(at, end === -1 ? bytes.length : end));
              at = end === -1 ? bytes.length : end + 1;
            }
            return out;
          }
          // end bytes
          // begin tree
          // Calls visit(at, full, stat) for every entry under root, in name order,
          // with at its path from root, segments joined by /, and stat its lstat. The
          // names in skip are left out at the top level. Directory names are read as
          // bytes, and a name that is not well-formed UTF-8, or an entry that cannot
          // be read, throws, naming it.
          function walk(root, skip, visit) {
            const fs = require('node:fs');
            const path = require('node:path');
            const unreadable = (at, e) => new Error(`${JSON.stringify(at)} cannot be read (${e.code || e.message})`);
            const down = (rel) => {
              let raw;
              try {
                raw = fs.readdirSync(rel ? path.join(root, rel) : root, { encoding: 'buffer' });
              } catch (e) {
                throw unreadable(rel || '.', e);
              }
              const names = raw.map((name) => {
                const text = decoded(name);
                if (text === null) throw new Error(`${showBytes(Buffer.concat([Buffer.from(rel ? `${rel}/` : ''), name]))} has a name that is not well-formed UTF-8`);
                return text;
              }).sort();
              for (const name of names) {
                if (!rel && skip.includes(name)) continue;
                const at = rel ? `${rel}/${name}` : name;
                const full = path.join(root, at);
                let stat;
                try {
                  stat = fs.lstatSync(full);
                } catch (e) {
                  throw unreadable(at, e);
                }
                visit(at, full, stat);
                if (stat.isDirectory()) down(at);
              }
            };
            down('');
          }
          // Every entry under root but the names in skip, by path: "dir" for a
          // directory, a symlink's target, or a regular file's executable bit and
          // SHA-256. No symlink is followed: a file is read through a descriptor
          // opened with O_NOFOLLOW and confirmed regular by fstat. A FIFO, socket or
          // device throws, naming it.
          function snapshot(root, skip) {
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { O_RDONLY, O_NOFOLLOW, O_NONBLOCK } = fs.constants;
            const out = new Map();
            const read = (at, how) => {
              try {
                return how();
              } catch (e) {
                throw new Error(`${JSON.stringify(at)} cannot be read (${e.code || e.message})`);
              }
            };
            walk(root, skip, (at, full, stat) => {
              if (stat.isDirectory()) {
                out.set(at, 'dir');
              } else if (stat.isSymbolicLink()) {
                const target = read(at, () => fs.readlinkSync(full, { encoding: 'buffer' }));
                const text = decoded(target);
                if (text === null) throw new Error(`${JSON.stringify(at)} links to ${showBytes(target)}, which is not well-formed UTF-8`);
                out.set(at, `link ${text}`);
              } else if (stat.isFile()) {
                const fd = read(at, () => fs.openSync(full, O_RDONLY | O_NOFOLLOW | O_NONBLOCK));
                try {
                  const st = read(at, () => fs.fstatSync(fd));
                  if (!st.isFile()) throw new Error(`${JSON.stringify(at)} is no longer a regular file once opened`);
                  const bytes = read(at, () => fs.readFileSync(fd));
                  out.set(at, `${st.mode & 0o111 ? 'x' : '-'} ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
                } finally {
                  fs.closeSync(fd);
                }
              } else {
                const kind = stat.isFIFO() ? 'a FIFO' : stat.isSocket() ? 'a socket'
                  : stat.isBlockDevice() || stat.isCharacterDevice() ? 'a device' : 'of no known kind';
                throw new Error(`${JSON.stringify(at)} is ${kind}, which a snapshot refuses`);
              }
            });
            return out;
          }
          // The first entry, in path order, that was removed, added or changed.
          function treeChange(before, after) {
            for (const at of [...new Set([...before.keys(), ...after.keys()])].sort()) {
              if (!after.has(at)) return `${JSON.stringify(at)} was removed`;
              if (!before.has(at)) return `${JSON.stringify(at)} was added`;
              if (before.get(at) !== after.get(at)) return `${JSON.stringify(at)} was changed`;
            }
            return null;
          }
          // end tree
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const dir = path.join(env.RUNNER_TEMP, 'prove-evidence');
          const load = (n) => new Map(JSON.parse(fs.readFileSync(path.join(dir, `tree-${n}.json`), 'utf8')));
          for (let n = 1; n <= 3; n++) {
            const why = treeChange(load(n - 1), load(n));
            if (why) {
              process.stderr.write(`check the tree failed: during run ${n}, ${why}\n`);
              process.exit(1);
            }
          }
          process.stdout.write('nothing outside test/ changed during the runs\n');

      - name: judge the result
        shell: node {0}
        env: &judge-the-result-env
          TESTS: ${{ inputs.tests }}
          ROWS: ${{ inputs.rows }}
          ENTRY: ${{ matrix.i }}
          SIDE: ${{ github.job }}
        run: &judge-the-result-run |
          'use strict';
          // begin run
          const FLAGS = '--test --test-reporter=tap --require ./test/helpers/account-home-refused.js --require ./test/helpers/stall-guard.js';
          const escape = (name) => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          // The test's TAP goes to its standard output, the pipe the trusted step
          // reads, and never to a file the test could also write.
          function testArgs(test) {
            return [...FLAGS.split(' '), '--test-name-pattern', `^${escape(test.name)}$`, test.file];
          }
          // A red or green job runs the test its entry names; a break job runs
          // the test its row names.
          function testFor(side, entry, tests, rows) {
            const one = (list, i) => list.filter((e) => String(e.i) === String(i));
            const [row] = side === 'break' ? one(rows, entry) : [{ test: entry }];
            const found = row ? one(tests, row.test) : [];
            if (found.length !== 1) throw new Error(`no single test for ${side} ${JSON.stringify(entry)}`);
            return found[0];
          }
          // end run
          // begin classifier
          // A name as the TAP reporter prints it: control characters as a
          // backslash and a letter, then every backslash doubled, then # escaped.
          function tapName(name) {
            let out = name;
            for (const [c, e] of [['\b', 'b'], ['\f', 'f'], ['\t', 't'], ['\n', 'n'], ['\r', 'r'], ['\v', 'v']]) out = out.split(c).join(`\\${e}`);
            return out.split('\\').join('\\\\').split('#').join('\\#');
          }
          // A printed name with whitespace removed from both ends, counting the
          // reporter's escapes for a tab, newline, carriage return, vertical tab and
          // form feed (a doubled backslash and a letter) as whitespace.
          function trimTap(s) {
            const edge = (x) => /^\s$/.test(x) || /^\\\\[tnrvf]$/.test(x);
            let a = 0;
            let b = s.length;
            for (let k; (k = [1, 3].find((w) => a + w <= b && edge(s.slice(a, a + w)))); ) a += k;
            for (let k; (k = [1, 3].find((w) => b - w >= a && edge(s.slice(b - w, b)))); ) b -= k;
            return s.slice(a, b);
          }
          const SUMMARY = ['tests', 'suites', 'pass', 'fail', 'cancelled', 'skipped', 'todo', 'duration_ms'];
          const CANCELLED = ['cancelledByParent', 'testAborted', 'testTimeoutFailure'];
          // The results in one TAP document, each with its parent and full name, or
          // null for anything but what the reporter writes: one version line first;
          // results indented four spaces a level and numbered 1 to n, each level
          // closed by a plan that counts it; YAML blocks closed where they open; one
          // top-level plan, then the eight summary lines once each, each count equal
          // to the results it counts; and comments. A 1..0 line directly after the
          // version line is the form Node prints when nothing is selected.
          function parseTap(text) {
            const lines = text.split('\n');
            if (lines[lines.length - 1] === '') lines.pop();
            if (lines[0] !== 'TAP version 13' || lines.indexOf('TAP version 13', 1) !== -1) return null;
            const levels = [{ results: [], plan: null }];
            const level = (d) => { while (levels.length <= d + 1) levels.push({ results: [], plan: null }); return levels[d]; };
            const empty = (from) => levels.slice(from).every((l) => !l.results.length && l.plan === null);
            const summary = new Map();
            let top = false;
            for (let n = 1; n < lines.length; n++) {
              const line = lines[n];
              if (n === 1 && line === '1..0') continue;
              if (/^ *#/.test(line)) {
                if (!top || !/^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)\b/.test(line)) continue;
                const s = /^# (tests|suites|pass|fail|cancelled|skipped|todo) (0|[1-9]\d*)$|^# (duration_ms) \d+(?:\.\d+)?$/.exec(line);
                if (!s || summary.has(s[1] || s[3])) return null;
                summary.set(s[1] || s[3], s[2]);
                continue;
              }
              if (top) return null;
              const plan = /^( *)1\.\.(\d+)$/.exec(line);
              if (plan) {
                const d = plan[1].length / 4;
                if (!Number.isInteger(d)) return null;
                const at = level(d);
                if (at.plan !== null || String(at.results.length) !== plan[2] || !empty(d + 1)) return null;
                if (d > 0 && !at.results.length) return null;
                at.plan = plan[2];
                top = d === 0;
                continue;
              }
              // A name can hold U+2028 or U+2029, which the reporter prints as they
              // are, so . must match them.
              const m = /^( *)(not ok|ok) (\d+)(?: - (.*))?$/s.exec(line);
              const depth = m ? m[1].length / 4 : NaN;
              const d = m && /^((?:\\.|[^\\#])*)(?:# (SKIP|TODO)\b.*)?$/s.exec(m[4] || '');
              if (!d || !Number.isInteger(depth)) return null;
              const at = level(depth);
              const below = levels[depth + 1];
              if (at.plan !== null || m[3] !== String(at.results.length + 1) || !empty(depth + 2)) return null;
              if (below.plan !== String(below.results.length) && (below.plan !== null || below.results.length)) return null;
              const node = {
                name: d[2] ? d[1].replace(/ $/, '') : d[1], ok: m[2] === 'ok', directive: d[2] || null,
                depth, code: null, failureType: null, type: null, exitCode: null, children: below.results,
              };
              levels[depth + 1] = { results: [], plan: null };
              at.results.push(node);
              const pad = ' '.repeat(depth * 4 + 2);
              if (lines[n + 1] !== `${pad}---`) continue;
              const seen = new Set();
              for (n += 2; lines[n] !== `${pad}...`; n++) {
                if (n >= lines.length || !lines[n].startsWith(pad)) return null;
                // The reporter prints an exitCode line on a file's own result,
                // never on a test's.
                const exit = /^exitCode: (.+)$/.exec(lines[n].slice(pad.length));
                if (exit) node.exitCode = exit[1];
                const kv = /^(code|failureType|type): '([^']*)'$/.exec(lines[n].slice(pad.length));
                if (!kv) continue;
                if (seen.has(kv[1])) return null;
                seen.add(kv[1]);
                node[kv[1]] = kv[2];
              }
            }
            if (!top || !empty(1) || summary.size !== SUMMARY.length) return null;
            const all = [];
            const count = { tests: 0, suites: 0, pass: 0, fail: 0, cancelled: 0, skipped: 0, todo: 0 };
            const visit = (node, parent) => {
              node.parent = parent;
              node.full = parent ? `${parent.full} ${node.name}` : node.name;
              all.push(node);
              // As Node's runner counts a finished test: a suite only as a suite.
              if (node.type === 'suite') count.suites++;
              else {
                count.tests++;
                if (node.directive === 'SKIP') count.skipped++;
                else if (node.directive === 'TODO') count.todo++;
                else if (CANCELLED.includes(node.failureType)) count.cancelled++;
                else count[node.ok ? 'pass' : 'fail']++;
              }
              node.children.forEach((c) => visit(c, node));
            };
            levels[0].results.forEach((node) => visit(node, null));
            return Object.keys(count).every((k) => summary.get(k) === String(count[k])) ? all : null;
          }
          // What one run of the named test in the named file did.
          function outcome(text, name, file) {
            const all = parseTap(text);
            if (!all) return 'unparseable';
            // Node reports a file under the file's own name when it selected no
            // test, after a 1..0 plan directly below the version line, and when
            // its process failed or a signal ended it, with an exitCode line in
            // that result's YAML. Either result is the file's, never the test
            // asked for. A real test can carry the same name, and without that
            // evidence it is counted as a test.
            const none = text.split('\n')[1] === '1..0';
            const files = all.filter((x) => x.depth === 0 && x.name === tapName(file) && (none || x.exitCode !== null));
            const want = tapName(name);
            // Node selects a test by its own name, or by its full name trimmed.
            const selected = all.filter((x) => !files.includes(x) && (x.name === want || trimTap(x.full) === want));
            if (!selected.length) return files.some((x) => !x.ok) ? 'failed to load' : 'selected 0';
            if (selected.length > 1) return `selected ${selected.length}`;
            const [node] = selected;
            const inside = [];
            const collect = (x) => { inside.push(x); x.children.forEach(collect); };
            collect(node);
            const above = [];
            for (let p = node.parent; p; p = p.parent) above.push(p);
            const marks = [...above, ...inside].map((x) => x.directive);
            if (marks.includes('SKIP')) return 'skipped';
            if (marks.includes('TODO')) return 'todo';
            // An enclosing suite fails because the test did; any other failure
            // outside the test is something else going wrong.
            const excused = (x) => !node.ok && above.includes(x) && x.failureType === 'subtestsFailed';
            if (all.some((x) => !x.ok && !inside.includes(x) && !excused(x))) return 'failed outside the test';
            const failures = inside.filter((x) => !x.ok);
            if (node.ok) return failures.length ? 'failed on something else' : 'passed';
            const assertion = (x) => x.code === 'ERR_ASSERTION' && x.failureType === 'testCodeFailure';
            const onlyAssertions = failures.every((x) => assertion(x) || x.failureType === 'subtestsFailed');
            return onlyAssertions && failures.some(assertion) ? 'assertion failed' : 'failed on something else';
          }
          const WANT = { red: 'assertion failed', green: 'passed', break: 'assertion failed' };
          // Why the three runs do not give the side its result, or null.
          function verdict(side, outcomes) {
            if (!Object.prototype.hasOwnProperty.call(WANT, side)) return `there is no side named ${JSON.stringify(side)}`;
            if (outcomes.length !== 3) return `there were ${outcomes.length} runs, not 3`;
            const n = outcomes.findIndex((o) => o !== WANT[side]);
            return n === -1 ? null : `run ${n + 1}: ${outcomes[n]}, where a ${side} job needs every run to be ${WANT[side]}`;
          }
          // Why the name did not select exactly one test in every run, or null.
          function selectionProblem(outcomes) {
            const n = outcomes.findIndex((o) => /^selected \d+$/.test(o));
            return n === -1 ? null : `run ${n + 1}: the name ${outcomes[n]} tests, where it must select exactly one`;
          }
          // end classifier
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const test = testFor(env.SIDE, env.ENTRY, JSON.parse(env.TESTS), JSON.parse(env.ROWS));
          const dir = path.join(env.RUNNER_TEMP, 'prove-evidence');
          const read = (n) => { try { return fs.readFileSync(path.join(dir, `run-${n}.tap`), 'utf8'); } catch (e) { return ''; } };
          const outcomes = [1, 2, 3].map((n) => outcome(read(n), test.name, test.file));
          const token = require('node:crypto').randomBytes(16).toString('hex');
          console.log(`::stop-commands::${token}`);
          for (let n = 1; n <= 3; n++) console.log(`run ${n} TAP:\n${read(n)}`);
          console.log(`::${token}::`);
          outcomes.forEach((o, n) => console.log(`run ${n + 1}: ${o}`));
          const why = verdict(env.SIDE, outcomes);
          if (why) {
            console.error(`judge the result failed: ${why}`);
            process.exit(1);
          }
          console.log(`every run is ${WANT[env.SIDE]}, as a ${env.SIDE} job needs`);

  green:
    name: green ${{ matrix.i }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every job's result is evidence, so one failure never cancels the rest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tests) }}
    steps:
      - name: check out the workflow's commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: check inputs
        shell: node {0}
        env: *check-inputs-env
        run: *check-inputs-run

      - name: check out the fix head
        env: &check-out-the-fix-head-env
          HEAD_SHA: ${{ inputs.head }}
        run: &check-out-the-fix-head-run git checkout -q --detach "$HEAD_SHA"

      - name: prepare the test user
        shell: node {0}
        run: *prepare-the-test-user-run

      - name: install
        shell: node {0}
        run: *install-run

      - name: run the test
        shell: node {0}
        env: *run-the-test-env
        run: *run-the-test-run

      - name: stop the test user
        shell: node {0}
        env: *stop-the-test-user-env
        run: *stop-the-test-user-run

      - name: check the tree
        shell: node {0}
        run: *check-the-tree-run

      - name: judge the result
        shell: node {0}
        env: *judge-the-result-env
        run: *judge-the-result-run

  break:
    name: break ${{ matrix.i }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every job's result is evidence, so one failure never cancels the rest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.rows) }}
    steps:
      - name: check out the workflow's commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: check inputs
        shell: node {0}
        env: *check-inputs-env
        run: *check-inputs-run

      - name: check out the fix head
        env: *check-out-the-fix-head-env
        run: *check-out-the-fix-head-run

      - name: apply the row
        shell: node {0}
        env:
          ROWS: ${{ inputs.rows }}
          ENTRY: ${{ matrix.i }}
        run: |
          'use strict';
          // begin apply row
          // The file with the row's from replaced by its to, or why it cannot be.
          function applyRow(buffer, row) {
            const from = Buffer.from(row.from, 'utf8');
            const at = buffer.indexOf(from);
            const again = at === -1 ? -1 : buffer.indexOf(from, at + 1);
            if (at === -1 || again !== -1) {
              return { why: `row ${row.i}: its from occurs ${at === -1 ? 'nowhere' : 'more than once'} in ${JSON.stringify(row.file)}` };
            }
            return { buffer: Buffer.concat([buffer.subarray(0, at), Buffer.from(row.to, 'utf8'), buffer.subarray(at + from.length)]) };
          }
          // end apply row
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const row = JSON.parse(env.ROWS).find((r) => String(r.i) === String(env.ENTRY));
          const file = path.join(process.cwd(), ...row.file.split('/'));
          const out = applyRow(fs.readFileSync(file), row);
          if (out.why) {
            console.error(`apply the row failed: ${out.why}`);
            process.exit(1);
          }
          fs.writeFileSync(file, out.buffer);
          console.log(`row ${row.i} is applied`);

      - name: prepare the test user
        shell: node {0}
        run: *prepare-the-test-user-run

      - name: install
        shell: node {0}
        run: *install-run

      - name: run the test
        shell: node {0}
        env: *run-the-test-env
        run: *run-the-test-run

      - name: stop the test user
        shell: node {0}
        env: *stop-the-test-user-env
        run: *stop-the-test-user-run

      - name: check the tree
        shell: node {0}
        run: *check-the-tree-run

      - name: judge the result
        shell: node {0}
        env: *judge-the-result-env
        run: *judge-the-result-run
