            if (outcomes.length !== 3) return `there were ${outcomes.length} runs, not 3`;
            const n = outcomes.findIndex((o) => o !== WANT[side]);
            return n === -1 ? null : `run ${n + 1}: ${outcomes[n]}, where a ${side} job needs every run to be ${WANT[side]}`;
          }
          // Why the name did not select exactly one test in every run, or null.
          function selectionProblem(outcomes) {
            const n = outcomes.findIndex((o) => /^selected \d+$/.test(o));
            return n === -1 ? null : `run ${n + 1}: the name ${outcomes[n]} tests, where it must select exactly one`;
          }
          // end classifier
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const test = testFor(env.SIDE, env.ENTRY, JSON.parse(env.TESTS), JSON.parse(env.ROWS));
          const dir = path.join(env.RUNNER_TEMP, 'prove');
          const read = (n) => { try { return fs.readFileSync(path.join(dir, `run-${n}.tap`), 'utf8'); } catch (e) { return ''; } };
          const outcomes = [1, 2, 3].map((n) => outcome(read(n), test.name, test.file));
          const token = require('node:crypto').randomBytes(16).toString('hex');
          console.log(`::stop-commands::${token}`);
          for (let n = 1; n <= 3; n++) console.log(`run ${n} TAP:\n${read(n)}`);
          console.log(`::${token}::`);
          outcomes.forEach((o, n) => console.log(`run ${n + 1}: ${o}`));
          const why = verdict(env.SIDE, outcomes);
          if (why) {
            console.error(`judge the result failed: ${why}`);
            process.exit(1);
          }
          console.log(`every run is ${WANT[env.SIDE]}, as a ${env.SIDE} job needs`);
