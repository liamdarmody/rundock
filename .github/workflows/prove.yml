name: Prove
run-name: prove ${{ inputs.nonce }} ${{ inputs.blocked }} ${{ inputs.main }} ${{ inputs.head }} ${{ inputs.inputs_sha256 }}

# Runs each blocker test at the blocked head and at the fix head, and runs each
# breakage, every one on a fresh runner, so the run's own record shows whether
# each blocker test fails on an assertion before the fix and passes after it,
# and whether each breakage is caught.
#
#   red <i>    the blocked head with main merged in, the fix head's tests, test i
#   green <i>  the fix head, test i
#   break <i>  the fix head with row i applied, the row's test
#
# Each job runs its test three times and fails at the first step that went
# wrong, so the name of that step says why.
#
# Started by hand only. Every input reaches a step through env, never as text
# inside a run block, and `check inputs` checks them all before any is used.
# Before `prepare the test user`, nothing from the commits under test runs, and
# only git reads them. From then on, everything from the commits that runs, the
# install included, runs as a separate test user, started through one function
# that clears its environment. `prepare the test user` shows, before any of
# that code runs, that the test user is refused sudo, the Docker socket, the
# runner's home, the evidence directory, the Node the steps run and the
# directories on its own search path; `install` and `run the test` show it is
# refused the files that set later steps' environment and path. The steps the
# runner user runs from then on only read the test user's copy, never run it,
# and judge each run from the TAP and exit status that came back through a
# pipe and from snapshots of the copy, all kept in the evidence directory. A
# test written to deceive can still report a result it did not reach; it cannot
# change what these steps check.
#
# The code inside the run blocks sits between `// begin <name>` and
# `// end <name>` lines. The tests cut it out from there and run it. Each
# shared step's run block and env are written once, at the step's first use,
# and reused in later jobs through YAML anchors.

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 32 lowercase hex characters that tell this run apart
        required: true
        type: string
      blocked:
        description: the blocked head, a full commit SHA
        required: true
        type: string
      main:
        description: the main commit the fix is built on, a full commit SHA
        required: true
        type: string
      head:
        description: the fix head, a full commit SHA
        required: true
        type: string
      tests:
        description: 'the blocker tests, a JSON array of {"i", "file", "name"}'
        required: true
        type: string
      rows:
        description: 'the breakage rows, a JSON array of {"i", "file", "from", "to", "test"}'
        required: true
        type: string
      inputs_sha256:
        description: the SHA-256 of tests, a newline, then rows
        required: true
        type: string
      label:
        description: 'what the run proves, first in its title: # then the pull request number, a space and the first 7 characters of the fix head, or empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  red:
    name: red ${{ matrix.i }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every job's result is evidence, so one failure never cancels the rest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tests) }}
    steps:
      - name: check out the workflow's commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: check inputs
        shell: node {0}
        env: &check-inputs-env
          NONCE: ${{ inputs.nonce }}
          BLOCKED_SHA: ${{ inputs.blocked }}
          MAIN_SHA: ${{ inputs.main }}
          HEAD_SHA: ${{ inputs.head }}
          TESTS: ${{ inputs.tests }}
          ROWS: ${{ inputs.rows }}
          INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
          LABEL: ${{ inputs.label }}
        run: &check-inputs-run |
          'use strict';
          // begin bytes
          // Names read as bytes are decoded strictly: a byte that is not part of
          // well-formed UTF-8 is never read as U+FFFD, so a name holding byte 0xFF
          // never equals one holding a real U+FFFD. A leading byte order mark is kept.
          const DECODE = { fatal: true, ignoreBOM: true };
          // The text the bytes spell, or null when they are not well-formed UTF-8.
          function decoded(bytes) {
            try {
              return new TextDecoder('utf-8', DECODE).decode(bytes);
            } catch (e) {
              return null;
            }
          }
          // The bytes as a JSON string, each byte that does not decode written \xHH.
          function showBytes(bytes) {
            let out = '';
            for (let at = 0; at < bytes.length;) {
              const width = [1, 2, 3, 4].find((w) => at + w <= bytes.length && decoded(bytes.subarray(at, at + w)) !== null);
              out += width ? JSON.stringify(decoded(bytes.subarray(at, at + width))).slice(1, -1) : `\\x${bytes[at].toString(16).toUpperCase().padStart(2, '0')}`;
              at += width || 1;
            }
            return `"${out}"`;
          }
          // The bytes split on 0x00, without the empty field after a final 0x00.
          function nulFields(bytes) {
            const out = [];
            for (let at = 0; at < bytes.length;) {
              const end = bytes.indexOf(0, at);
              out.push(bytes.subarray(at, end === -1 ? bytes.length : end));
              at = end === -1 ? bytes.length : end + 1;
            }
            return out;
          }
          // end bytes
          // begin input checks
          // Each hex input has its pattern, the label is empty or names a pull
          // request and a short head, and inputs_sha256 is the digest of tests, a
          // newline, then rows. A label left out of the environment is empty.
          function shapeCheck(env) {
            const hex = [[env.NONCE, 'nonce', 32], [env.BLOCKED_SHA, 'blocked', 40], [env.MAIN_SHA, 'main', 40], [env.HEAD_SHA, 'head', 40], [env.INPUTS_SHA256, 'inputs_sha256', 64]];
            for (const [value, name, length] of hex) {
              if (!new RegExp(`^[0-9a-f]{${length}}$`).test(String(value))) return `${name} must be ${length} lowercase hex characters`;
            }
            const label = env.LABEL || '';
            if (label !== '' && !/^#[0-9]{1,6} [0-9a-f]{7}$/.test(label)) return 'label must be empty or # then 1 to 6 digits, a space and 7 lowercase hex characters';
            const digest = require('node:crypto').createHash('sha256').update(`${env.TESTS}\n${env.ROWS}`, 'utf8').digest('hex');
            return digest === env.INPUTS_SHA256 ? null : `inputs_sha256 is not the SHA-256 of tests, a newline and rows, which is ${digest}`;
          }
          const KEYS = { tests: 'file,i,name', rows: 'file,from,i,test,to' };
          // The list, each entry of its shape and the entries indexed 1..n.
          function listOf(text, label) {
            let list;
            try { list = JSON.parse(text); } catch (e) { return { why: `${label} is not JSON` }; }
            if (!Array.isArray(list) || list.length < 1 || list.length > 20) return { why: `${label} must be an array of 1 to 20 entries` };
            const str = (v, empty) => typeof v === 'string' && (empty || v !== '');
            for (const [n, e] of list.entries()) {
              const ok = e !== null && typeof e === 'object' && !Array.isArray(e) && Object.keys(e).sort().join(',') === KEYS[label]
                && Number.isInteger(e.i) && str(e.file)
                && (label === 'tests' ? str(e.name) : str(e.from) && str(e.to, true) && Number.isInteger(e.test));
              if (!ok) return { why: `${label} entry ${n + 1} must have exactly the keys ${KEYS[label]}, each of its type` };
            }
            if (list.map((e) => e.i).sort((a, b) => a - b).some((i, n) => i !== n + 1)) return { why: `${label} must be indexed 1 to ${list.length}, each once` };
            return { list };
          }
          // Each row's test is in tests, and every test is named by a row.
          function listsCheck(env) {
            const tests = listOf(env.TESTS, 'tests');
            if (tests.why) return tests.why;
            const rows = listOf(env.ROWS, 'rows');
            if (rows.why) return rows.why;
            const row = rows.list.find((r) => !tests.list.some((t) => t.i === r.test));
            if (row) return `row ${row.i} names test ${row.test}, which tests does not hold`;
            const unnamed = tests.list.find((t) => !rows.list.some((r) => r.test === t.i));
            return unnamed ? `test ${unnamed.i} is named by no row` : null;
          }
          // Every string in the entries is well-formed, so each one is the text git,
          // Node and the classifier will read: a lone surrogate is not.
          function wellFormedCheck(env) {
            for (const [label, list] of [['test', JSON.parse(env.TESTS)], ['row', JSON.parse(env.ROWS)]]) {
              for (const e of list) {
                const key = Object.keys(e).sort().find((k) => typeof e[k] === 'string' && !e[k].isWellFormed());
                if (key) return `${label} ${e.i} has a ${key} that is not well-formed Unicode`;
              }
            }
            return null;
          }
          // No test name starts or ends with whitespace, which Node trims from the
          // full names it compares and the classifier could not match exactly.
          function namesCheck(env) {
            const t = JSON.parse(env.TESTS).find((e) => e.name !== e.name.trim());
            return t ? `test ${t.i} has a name that starts or ends with whitespace` : null;
          }
          function isAncestor(git, a, b) {
            try {
              git(['merge-base', '--is-ancestor', a, b]);
              return true;
            } catch (e) {
              if (e.status === 1) return false;
              throw e;
            }
          }
          // Main is the tip of main or behind it, and main and the blocked head are
          // ancestors of the fix head.
          function commitsCheck(env, git) {
            git(['fetch', '-q', '--no-tags', 'origin', '+refs/heads/main:refs/remotes/origin/main']);
            for (const sha of [env.BLOCKED_SHA, env.MAIN_SHA, env.HEAD_SHA]) git(['fetch', '-q', '--no-tags', 'origin', sha]);
            if (!isAncestor(git, env.MAIN_SHA, 'refs/remotes/origin/main')) return 'main is not the tip of main or behind it';
            if (!isAncestor(git, env.MAIN_SHA, env.HEAD_SHA)) return 'main is not an ancestor of the fix head';
            if (!isAncestor(git, env.BLOCKED_SHA, env.HEAD_SHA)) return 'the blocked head is not an ancestor of the fix head';
            return null;
          }
          // A path exactly as git prints it: relative, with no empty, . or .. segment.
          function pathRule(p) {
            if (p.startsWith('./')) return 'starts with ./';
            if (p.includes('\\')) return 'holds a backslash';
            if (p.endsWith('/')) return 'ends with /';
            const parts = p.split('/');
            if (parts.includes('')) return 'has an empty segment';
            if (parts.includes('.')) return 'has a . segment';
            if (parts.includes('..')) return 'has a .. segment';
            return null;
          }
          // A row may not change the tests, the workflows, or what npm and Node read
          // at the root.
          const ROOT_FILES = ['package.json', 'package-lock.json', 'npm-shrinkwrap.json', '.npmrc', '.nvmrc'];
          function rowRule(p) {
            if (p.startsWith('test/')) return 'is under test/';
            if (p.startsWith('.github/')) return 'is under .github/';
            if (ROOT_FILES.includes(p)) return 'is a root file npm or Node reads';
            return null;
          }
          // Every path in a commit's tree with its mode, or why a path is not one: git
          // prints the tree as bytes, and a path that is not well-formed UTF-8 is
          // named rather than decoded.
          function treeModes(git, sha) {
            const modes = new Map();
            for (const entry of nulFields(git(['ls-tree', '-r', '-z', '--full-tree', sha]))) {
              const tab = entry.indexOf(0x09);
              const head = tab === -1 ? null : /^(\d{6}) \w+ [0-9a-f]+$/.exec(entry.subarray(0, tab).toString('latin1'));
              if (!head) return { why: `git ls-tree printed ${showBytes(entry)}, which is no mode, type, object and path` };
              const p = decoded(entry.subarray(tab + 1));
              if (p === null) return { why: `the fix head holds the path ${showBytes(entry.subarray(tab + 1))}, which is not well-formed UTF-8` };
              modes.set(p, head[1]);
            }
            return { modes };
          }
          function modeRule(p, modes) {
            const mode = modes.get(p);
            if (mode === undefined) return 'is not a file in the fix head';
            if (mode === '120000') return 'is a symlink in the fix head';
            if (mode === '160000') return 'is a submodule in the fix head';
            return mode === '100644' || mode === '100755' ? null : `has mode ${mode} in the fix head`;
          }
          function pathsCheck(tests, rows, modes) {
            for (const t of tests) {
              const why = pathRule(t.file) || (t.file.startsWith('test/') ? null : 'is outside test/') || modeRule(t.file, modes);
              if (why) return `test ${t.i} names ${JSON.stringify(t.file)}, which ${why}`;
            }
            for (const r of rows) {
              const why = pathRule(r.file) || rowRule(r.file) || modeRule(r.file, modes);
              if (why) return `row ${r.i} names ${JSON.stringify(r.file)}, which ${why}`;
            }
            return null;
          }
          // The first check that fails, named, or null.
          function checkInputs(env, git) {
            const checks = [
              ['shape', () => shapeCheck(env)],
              ['lists', () => listsCheck(env)],
              ['well-formed', () => wellFormedCheck(env)],
              ['names', () => namesCheck(env)],
              ['commits', () => commitsCheck(env, git)],
              ['paths', () => {
                const tree = treeModes(git, env.HEAD_SHA);
                return tree.why || pathsCheck(JSON.parse(env.TESTS), JSON.parse(env.ROWS), tree.modes);
              }],
            ];
            for (const [check, run] of checks) {
              let why;
              try {
                why = run();
              } catch (e) {
                why = `git failed: ${JSON.stringify(String(e.stderr || e.message).trim())}`;
              }
              if (why) return `${check}: ${why}`;
            }
            return null;
          }
          // end input checks
          const { execFileSync } = require('node:child_process');
          const git = (args) => execFileSync('git', args, { stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 64 * 1024 * 1024 });
          const env = process.env;
          const why = checkInputs(env, git);
          if (why) {
            console.error(`check inputs failed: ${why}`);
            process.exit(1);
          }
          console.log('every input holds');

      - name: merge main into the blocked head
        shell: node {0}
        env:
          BLOCKED_SHA: ${{ inputs.blocked }}
          MAIN_SHA: ${{ inputs.main }}
        run: |
          'use strict';
          // begin merge
          // The blocked head checked out with main merged into it, or why it could not be.
          function mergeMain(git, env) {
            try {
              git(['checkout', '-q', '--detach', env.BLOCKED_SHA]);
              git(['-c', 'user.name=prove', '-c', 'user.email=prove@example.invalid', 'merge', '--no-edit', env.MAIN_SHA]);
              return null;
            } catch (e) {
              return `git stopped: ${JSON.stringify(`${e.stdout || ''}${e.stderr || ''}`.trim())}`;
            }
          }
          // end merge
          const { execFileSync } = require('node:child_process');
          const git = (args) => execFileSync('git', args, { stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 64 * 1024 * 1024 });
          const env = process.env;
          const why = mergeMain(git, env);
          if (why) {
            console.error(`merge main into the blocked head failed: ${why}`);
            process.exit(1);
          }
          console.log('main is merged into the blocked head');

      - name: check the change
        shell: node {0}
        env:
          ROWS: ${{ inputs.rows }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          'use strict';
          // begin bytes
          // Names read as bytes are decoded strictly: a byte that is not part of
          // well-formed UTF-8 is never read as U+FFFD, so a name holding byte 0xFF
          // never equals one holding a real U+FFFD. A leading byte order mark is kept.
          const DECODE = { fatal: true, ignoreBOM: true };
          // The text the bytes spell, or null when they are not well-formed UTF-8.
          function decoded(bytes) {
            try {
              return new TextDecoder('utf-8', DECODE).decode(bytes);
            } catch (e) {
              return null;
            }
          }
          // The bytes as a JSON string, each byte that does not decode written \xHH.
          function showBytes(bytes) {
            let out = '';
            for (let at = 0; at < bytes.length;) {
              const width = [1, 2, 3, 4].find((w) => at + w <= bytes.length && decoded(bytes.subarray(at, at + w)) !== null);
              out += width ? JSON.stringify(decoded(bytes.subarray(at, at + width))).slice(1, -1) : `\\x${bytes[at].toString(16).toUpperCase().padStart(2, '0')}`;
              at += width || 1;
            }
            return `"${out}"`;
          }
          // The bytes split on 0x00, without the empty field after a final 0x00.
          function nulFields(bytes) {
            const out = [];
            for (let at = 0; at < bytes.length;) {
              const end = bytes.indexOf(0, at);
              out.push(bytes.subarray(at, end === -1 ? bytes.length : end));
              at = end === -1 ? bytes.length : end + 1;
            }
            return out;
          }
          // end bytes
          // begin change check
          // Renames are not detected, so a rename is reported as both paths.
          const DIFF = 'git -c core.quotePath=false diff -z --name-only --no-renames';
          // Every path that differs between the two commits. git prints them as bytes,
          // and a path that is not well-formed UTF-8 throws, named, rather than being
          // decoded into one that could equal a row's file.
          function changedPaths(git, from, to) {
            return nulFields(git([...DIFF.split(' ').slice(1), from, to])).map((field) => {
              const p = decoded(field);
              if (p === null) throw new Error(`${showBytes(field)} changed, and is not well-formed UTF-8`);
              return p;
            });
          }
          // Why the change holds more than test/ and the rows' files, or null.
          function changeCheck(paths, rows) {
            const files = new Set(rows.map((r) => r.file));
            const outside = paths.filter((p) => !p.startsWith('test/') && !files.has(p));
            if (!outside.length) return null;
            return `${outside.map((p) => JSON.stringify(p)).join(', ')} changed, outside test/ and in no row's file`;
          }
          // end change check
          const { execFileSync } = require('node:child_process');
          const git = (args) => execFileSync('git', args, { stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 64 * 1024 * 1024 });
          const env = process.env;
          let why;
          try {
            why = changeCheck(changedPaths(git, 'HEAD', env.HEAD_SHA), JSON.parse(env.ROWS));
          } catch (e) {
            why = e.message;
          }
          if (why) {
            console.error(`check the change failed: ${why}`);
            process.exit(1);
          }
          console.log("the change is test/ and the rows' files only");

      - name: take the tests from the fix head
        env:
          HEAD_SHA: ${{ inputs.head }}
        run: |
          rm -rf test
          git checkout "$HEAD_SHA" -- test

      - name: prepare the test user
        shell: node {0}
        run: &prepare-the-test-user-run |
          'use strict';
          // begin bytes
          // Names read as bytes are decoded strictly: a byte that is not part of
          // well-formed UTF-8 is never read as U+FFFD, so a name holding byte 0xFF
          // never equals one holding a real U+FFFD. A leading byte order mark is kept.
          const DECODE = { fatal: true, ignoreBOM: true };
          // The text the bytes spell, or null when they are not well-formed UTF-8.
          function decoded(bytes) {
            try {
              return new TextDecoder('utf-8', DECODE).decode(bytes);
            } catch (e) {
              return null;
            }
          }
          // The bytes as a JSON string, each byte that does not decode written \xHH.
          function showBytes(bytes) {
            let out = '';
            for (let at = 0; at < bytes.length;) {
              const width = [1, 2, 3, 4].find((w) => at + w <= bytes.length && decoded(bytes.subarray(at, at + w)) !== null);
              out += width ? JSON.stringify(decoded(bytes.subarray(at, at + width))).slice(1, -1) : `\\x${bytes[at].toString(16).toUpperCase().padStart(2, '0')}`;
              at += width || 1;
            }
            return `"${out}"`;
          }
          // The bytes split on 0x00, without the empty field after a final 0x00.
          function nulFields(bytes) {
            const out = [];
            for (let at = 0; at < bytes.length;) {
              const end = bytes.indexOf(0, at);
              out.push(bytes.subarray(at, end === -1 ? bytes.length : end));
              at = end === -1 ? bytes.length : end + 1;
            }
            return out;
          }
          // end bytes
          // begin tree
          // Calls visit(at, full, stat) for every entry under root, in name order,
          // with at its path from root, segments joined by /, and stat its lstat. The
          // names in skip are left out at the top level. Directory names are read as
          // bytes, and a name that is not well-formed UTF-8, or an entry that cannot
          // be read, throws, naming it.
          function walk(root, skip, visit) {
            const fs = require('node:fs');
            const path = require('node:path');
            const unreadable = (at, e) => new Error(`${JSON.stringify(at)} cannot be read (${e.code || e.message})`);
            const down = (rel) => {
              let raw;
              try {
                raw = fs.readdirSync(rel ? path.join(root, rel) : root, { encoding: 'buffer' });
              } catch (e) {
                throw unreadable(rel || '.', e);
              }
              const names = raw.map((name) => {
                const text = decoded(name);
                if (text === null) throw new Error(`${showBytes(Buffer.concat([Buffer.from(rel ? `${rel}/` : ''), name]))} has a name that is not well-formed UTF-8`);
                return text;
              }).sort();
              for (const name of names) {
                if (!rel && skip.includes(name)) continue;
                const at = rel ? `${rel}/${name}` : name;
                const full = path.join(root, at);
                let stat;
                try {
                  stat = fs.lstatSync(full);
                } catch (e) {
                  throw unreadable(at, e);
                }
                visit(at, full, stat);
                if (stat.isDirectory()) down(at);
              }
            };
            down('');
          }
          // Every entry under root but the names in skip, by path: "dir" for a
          // directory, a symlink's target, or a regular file's executable bit and
          // SHA-256. No symlink is followed: a file is read through a descriptor
          // opened with O_NOFOLLOW and confirmed regular by fstat. A FIFO, socket or
          // device throws, naming it.
          function snapshot(root, skip) {
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { O_RDONLY, O_NOFOLLOW, O_NONBLOCK } = fs.constants;
            const out = new Map();
            const read = (at, how) => {
              try {
                return how();
              } catch (e) {
                throw new Error(`${JSON.stringify(at)} cannot be read (${e.code || e.message})`);
              }
            };
            walk(root, skip, (at, full, stat) => {
              if (stat.isDirectory()) {
                out.set(at, 'dir');
              } else if (stat.isSymbolicLink()) {
                const target = read(at, () => fs.readlinkSync(full, { encoding: 'buffer' }));
                const text = decoded(target);
                if (text === null) throw new Error(`${JSON.stringify(at)} links to ${showBytes(target)}, which is not well-formed UTF-8`);
                out.set(at, `link ${text}`);
              } else if (stat.isFile()) {
                const fd = read(at, () => fs.openSync(full, O_RDONLY | O_NOFOLLOW | O_NONBLOCK));
                try {
                  const st = read(at, () => fs.fstatSync(fd));
                  if (!st.isFile()) throw new Error(`${JSON.stringify(at)} is no longer a regular file once opened`);
                  const bytes = read(at, () => fs.readFileSync(fd));
                  out.set(at, `${st.mode & 0o111 ? 'x' : '-'} ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
                } finally {
                  fs.closeSync(fd);
                }
              } else {
                const kind = stat.isFIFO() ? 'a FIFO' : stat.isSocket() ? 'a socket'
                  : stat.isBlockDevice() || stat.isCharacterDevice() ? 'a device' : 'of no known kind';
                throw new Error(`${JSON.stringify(at)} is ${kind}, which a snapshot refuses`);
              }
            });
            return out;
          }
          // The first entry, in path order, that was removed, added or changed.
          function treeChange(before, after) {
            for (const at of [...new Set([...before.keys(), ...after.keys()])].sort()) {
              if (!after.has(at)) return `${JSON.stringify(at)} was removed`;
              if (!before.has(at)) return `${JSON.stringify(at)} was added`;
              if (before.get(at) !== after.get(at)) return `${JSON.stringify(at)} was changed`;
            }
            return null;
          }
          // end tree
          // begin test user
