name: Release

# Builds, signs, notarises, and publishes Rundock when a version tag is pushed.
# electron-builder uploads to a GitHub release for the tag; by default the GitHub
# provider creates that release as a DRAFT, so artefacts land for review and are
# promoted to a public release manually (validate the draft first, then publish).
#
# Current scope: macOS (arm64 + x64) only. The windows and linux jobs below
# are scaffolded but inactive, activated when their platforms ship.
#
# Required repo secrets (documented in the maintainer's release-setup notes):
#   CSC_LINK            base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD    password for that .p12
#   APPLE_API_KEY_P8    base64 of the App Store Connect .p8 key
#   APPLE_API_KEY_ID    App Store Connect key id
#   APPLE_API_ISSUER    App Store Connect issuer id
#   APPLE_TEAM_ID       Apple Developer team id

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Gate the whole release on the test suite: a tag must never ship a red build.
  # Mirrors the CI workflow but pinned to the shipping Node (.nvmrc).
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Install jsdom for the editor suite
        # The editor round-trip suite boots the real editor under jsdom, a
        # devDependency the lean install omits. Same pinned install as CI;
        # without it the gate fails on ERR_MODULE_NOT_FOUND.
        run: npm install --no-save --ignore-scripts jsdom@29.1.1
      - name: Run tests
        run: npm test

  # Browser-driven suite gates the release alongside the Node suite: a tag
  # must never ship a broken client. Mirrors the CI e2e job.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies (incl. dev, for Playwright)
        # The full install runs network postinstalls (electron, ffmpeg-static)
        # that npm's own fetch retries do not cover; registry socket hang-ups
        # have killed this step three times. Retry the whole install with a
        # clean node_modules between attempts.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); cleaning and retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "npm ci failed on all 3 attempts"
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npx playwright test

  # The packaged app must BOOT before anything publishes. Source-level suites
  # cannot catch packaging mistakes; this is the gate that does.
  smoke:
    name: Packaged-app smoke test
    uses: ./.github/workflows/smoke.yml

  # ---------------------------------------------------------------------------
  # Create the draft release once, before either platform build runs.
  # electron-builder's own "create if the release is missing" check is not
  # safe to rely on: the Windows job builds two targets (NSIS installer and
  # portable exe) in one invocation, and on v0.12.0 both targets' uploads
  # reached that check in the same instant, both saw nothing there, and both
  # created a release. The installer landed on one duplicate, its own
  # blockmap on the other, a release the auto-updater cannot diff against,
  # not merely a cosmetic double entry.
  #
  # Idempotent: a re-run of this job, or a retry after a prior attempt
  # partially succeeded, finds the release it already made and does nothing
  # further. Draft releases are not addressable via /releases/tags/<tag> (see
  # the finalize job below), so the existence check lists and matches on
  # tag_name instead of trusting a direct lookup.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create the draft release
    needs: [test, e2e, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Extract release name and notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" --out release-info

      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Release $EXISTING already exists for $GITHUB_REF_NAME; leaving it as is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$(cat release-info/release-name.txt)" \
            --notes-file release-info/release-notes.md
          echo "Created draft release for $GITHUB_REF_NAME."

  macos:
    name: Build macOS (arm64 + x64)
    needs: [test, e2e, smoke, create-release]
    runs-on: macos-latest
    # Declares the protected release environment, which is where the signing
    # secrets now live. They were repository secrets, readable by ANY workflow
    # in this repo including one added on a pull request branch. The
    # environment restricts them to tags matching the release pattern and
    # holds the job for a reviewer, so a workflow on a branch cannot reach
    # them at all.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # The full install runs network postinstalls (electron, ffmpeg-static)
        # that npm's own fetch retries do not cover; registry socket hang-ups
        # have killed this step three times. Retry the whole install with a
        # clean node_modules between attempts.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); cleaning and retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "npm ci failed on all 3 attempts"
          exit 1

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Extract release name and notes from the changelog
        # Fails the build if the changelog has no entry for this version:
        # a draft release with blank notes must never be published.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" --out release-info

      - name: Build, sign, notarise, publish
        # Version comes from the tag (v1.2.3 -> 1.2.3) and overrides package.json,
        # so the built artefacts and the published release always match the tag.
        # releaseInfo names the draft release and fills its notes from the
        # changelog, so the draft arrives ready to review rather than blank.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION from tag $GITHUB_REF_NAME"
          npx electron-builder --mac --universal \
            -c.mac.notarize=true \
            -c.extraMetadata.version="$VERSION" \
            -c.releaseInfo.releaseName="$(cat release-info/release-name.txt)" \
            -c.releaseInfo.releaseNotesFile=release-info/release-notes.md \
            --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_API_KEY (path to the decoded .p8) is exported via GITHUB_ENV above.

  # ---------------------------------------------------------------------------
  # Windows build. Unsigned for v1 (no code-signing secrets); users click through
  # the one-time SmartScreen prompt. Builds an NSIS installer + portable .exe.
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows (x64)
    needs: [test, e2e, smoke, create-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # The full install runs network postinstalls (electron, ffmpeg-static)
        # that npm's own fetch retries do not cover; registry socket hang-ups
        # have killed this step three times. Retry the whole install with a
        # clean node_modules between attempts.
        # shell: bash is REQUIRED here and nowhere else in this file. Windows
        # runners default to PowerShell, which cannot parse a bash for-loop:
        # it fails with "Missing opening '(' after keyword 'for'" before npm
        # is ever reached. This retry wrapper was added to make CI steadier and
        # instead broke the Windows build outright, which stayed invisible
        # because this is the only workflow that builds Windows.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); cleaning and retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "npm ci failed on all 3 attempts"
          exit 1

      - name: Extract release name and notes from the changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" --out release-info

      - name: Build and publish
        # Use bash (available on Windows runners) so version extraction matches macOS.
        # The create-release job above has already made the draft, so this
        # releaseInfo is redundant with what is already on it rather than a
        # race to set it: electron-builder finds the existing release by tag
        # and uploads into it instead of creating one.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building Windows version $VERSION from tag $GITHUB_REF_NAME"
          npx electron-builder --win \
            -c.extraMetadata.version="$VERSION" \
            -c.releaseInfo.releaseName="$(cat release-info/release-name.txt)" \
            -c.releaseInfo.releaseNotesFile=release-info/release-notes.md \
            --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Name and fill the draft release deterministically. create-release above
  # already names it once, and electron-builder's releaseInfo flags on each
  # build job name it again, but the first live run (v0.11.5) showed
  # electron-builder does not reliably apply releaseInfo to the draft it
  # attaches artefacts to: the draft arrived untitled with an empty body and
  # was filled by hand, the exact manual step this pipeline exists to remove.
  # This job is the single deterministic writer of record: after both builds
  # finish, it patches the draft via the API with the same changelog-derived
  # name and notes, so the final state does not depend on any build job
  # having applied its copy correctly.
  #
  # The last step of this job then reads the draft back and asserts it is what
  # the tag should have produced. Until it existed, a green release workflow
  # proved only that no step had thrown: the draft itself was never checked.
  # ---------------------------------------------------------------------------
  finalize:
    name: Name, fill, and verify the draft release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Extract release name and notes from the changelog
        # Same extraction as the build jobs; it already failed the build there
        # if the changelog had no entry, so here it can only succeed.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" --out release-info

      - name: Patch the draft release with the name and notes
        # Draft releases are not addressable via /releases/tags/<tag>, so list
        # and match on tag_name instead.
        #
        # tag_name is resent here even though it is not changing. GitHub's
        # release PATCH endpoint drops the tag binding to a generated
        # "untagged-<hash>" placeholder on any edit that omits it: cutting
        # 0.11.7 produced a draft with the right name, the right notes and
        # all nine artefacts, bound to that placeholder rather than the tag,
        # and 0.12.0 hit the same thing when this step patched name and body
        # without it. Every future PATCH to this release must carry it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for ${GITHUB_REF_NAME}; electron-builder should have created the draft" >&2
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="$(cat release-info/release-name.txt)" \
            -f body="$(cat release-info/release-notes.md)" > /dev/null
          echo "Draft release ${RELEASE_ID} named and filled from the changelog."

      - name: Verify the draft release
        # Deliberately after the patch above rather than merely after the
        # builds: the patch is the step most likely to disturb the tag
        # binding (see its comment), so a check that ran before it would
        # attest to a state nobody publishes. Kept as a second, independent
        # line of defence even with tag_name now resent above: this is
        # exactly the class of defect (an omitted field silently resetting
        # state) that recurs when someone next edits this step without
        # reading why the field is there.
        #
        # The script re-fetches the release list itself. It does not reuse
        # RELEASE_ID above, and could not: each run block is a fresh shell.
        # That is the behaviour wanted anyway, since the question is what
        # actually landed, not what the patch was aimed at.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-draft.js --info-dir release-info

  # ---------------------------------------------------------------------------
  # SCAFFOLDED, INACTIVE. Reserved for future Linux support.
