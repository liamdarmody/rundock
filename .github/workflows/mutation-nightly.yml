# The complete mutation set: every harness, no selection at all.
#
# WHY THIS IS A SEPARATE WORKFLOW, AND NOT A STEP IN ci.yml.
# The local gate and the CI mutation job both run the SCOPED set: only the
# harnesses a change can reach. That selection is what makes them fast enough to
# run on every commit, and it is safe only while something, somewhere, runs the
# complete set. This is that something.
#
# It does not belong on the critical path. Measured before this was settled: the
# complete set is 1204s here and 1628s on a developer machine, so putting it on
# every push cost twenty minutes per review to re-check harnesses no change in
# the branch could reach. Off the critical path the same twenty minutes costs
# nobody anything, because nobody is waiting on it.
#
# WHAT THIS CATCHES THAT THE SCOPED RUN CANNOT. A harness rots without anyone
# touching it: pinned to source text that has since moved, or resting on a
# behaviour of the machine it happened to run on. The first exhaustive run in CI
# found exactly that. A guard in the boundary harness was passing because the
# only spelling it compared came from os.tmpdir(), which is aliased on macOS and
# not on Linux, so the mutation was invisible on the platform CI runs. No commit
# broke it, so no scoped run would ever have selected it. Only running everything
# on a machine that is not the author's could surface it, and that is this job.
#
# BEFORE A RELEASE. Cutting a release is the other moment the complete set is
# worth waiting for. Dispatch this workflow and let it finish before tagging.
name: Nightly mutation sweep

on:
  schedule:
    # 03:00 UTC. Nothing waits on this, so the only thing the hour has to do is
    # avoid competing with the working day.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Deliberately NOT sharing ci.yml's concurrency group. That group cancels in
# progress runs on a new push to the same ref, which is right for a job someone
# is waiting on and wrong for this one: a day of pushes to main would cancel the
# sweep every time and it would never complete.
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  # SHARDS, NOT ONE JOB. Run end to end in one job, the complete set outgrew
  # each timeout it was given and was cut off with rows unrun. It now has the
  # scoped run's shape from ci.yml: the plan packs every harness into shards by
  # measured cost, the shards run side by side, and the verdict job reads every
  # shard's verdict into one outcome. Growth adds shards, not minutes, up to the
  # planner's cap (MAX_SHARDS in scripts/mutation-scope.js). The complete set
  # already fills it, so from here each shard lengthens instead; a shard nearing
  # its timeout is the sign to raise the cap.
  #
  # The job names differ from ci.yml's on purpose: required checks match by
  # name across workflows, so a nightly `Mutation guards` could stand in for
  # the scoped check on a commit this sweep ran on.
  mutation-plan:
    name: Plan every harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      # Every harness the selector discovers in test/tools/, so a new harness
      # is in the sweep the day it lands, with no list to update. Writing the
      # plan runs nothing.
      - name: Shard every harness
        id: plan
        run: node scripts/mutation-scope.js --all --plan --out mutation-plan.json

      - name: Keep the plan for the shards and the verdict
        uses: actions/upload-artifact@v7
        with:
          name: mutation-plan
          path: mutation-plan.json
          retention-days: 7

  mutation-shard:
    name: Sweep shard ${{ matrix.shard }}
    needs: mutation-plan
    if: needs.mutation-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # A shard is planned at ten minutes, more once the cap is reached. Thirty
    # bounds a hang; a shard cut off here writes no verdict, which reads as no
    # verdict, never as a pass.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      # The harnesses run suites that need a DOM. Without this the suites fail to
      # load, every mutation looks red, and the sweep reports a clean table over
      # a run where nothing was verified.
      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Fetch the plan
        uses: actions/download-artifact@v8
        with:
          name: mutation-plan

      - name: Remove each guard in this shard, and require a red test
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.count }}
        run: >-
          node scripts/mutation-scope.js --shard "$SHARD/$SHARDS"
          --plan-file mutation-plan.json --verdict "verdict-$SHARD.json"

      # The tools restore what they mutate, including when a run throws. A
      # shard that leaves any file modified is itself worth seeing.
      - name: Fail if any tool left a file modified
        run: git diff --exit-code

      - name: Keep this shard's verdict, whether it passed or not
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-verdict-${{ matrix.shard }}
          path: verdict-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

  mutation-sweep:
    name: Complete set verdict
    needs: [mutation-plan, mutation-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch the plan and every verdict
        if: needs.mutation-plan.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: mutation
          merge-multiple: true

      # Pass, fail, or no verdict. A shard that wrote no verdict (it died, was
      # cancelled or timed out) is no verdict for that shard, and the sweep
      # ends non-green, titled "No verdict".
      - name: One outcome from every shard
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
        run: >-
          node scripts/mutation-scope.js --aggregate
          --plan-file mutation/mutation-plan.json --verdicts mutation
          --plan-result "$PLAN_RESULT"
