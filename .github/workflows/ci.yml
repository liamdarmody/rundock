name: CI

# A push or pull request titles its own run from the commit subject or the pull
# request title. A manually dispatched run has neither, so it appeared in the
# runs list as the bare workflow name, indistinguishable from every other
# dispatch. Name those by what identifies them: the branch and who started it.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('CI on {0} (dispatched by {1})', github.ref_name, github.actor)
      || '' }}

# Runs the test suite on every push to main and every pull request, so no change
# to the server (a formerly untested ~4.3k-line monolith) merges without the
# regression net passing. --omit=dev installs just the runtime deps (ws) and
# skips the heavy Electron build toolchain; the editor round-trip suite runs
# the real Tiptap editor under jsdom, which is installed individually (pinned
# to the lockfile version) rather than pulling all devDependencies. Matrix
# covers the shipping Node (.nvmrc = 22, the packaged Electron runtime's Node
# line, and the floor for node:sqlite-backed search) and the dev runtime (24).

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs against any branch. Exists because push and pull_request
  # event processing has been observed to stall on GitHub's side while
  # dispatch kept working; this keeps full CI reachable for a branch when
  # that happens.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-free guard: no internal run codenames, review-round or
  # priority labels, or private workspace paths leak into the public source.
  hygiene:
    name: Hygiene (internal references, style drift)
    runs-on: ubuntu-latest
    # Ceiling, not a wait. Observed maxima this session are far below it, so a
    # healthy run is unaffected and only a stuck one is cut short. Without any
    # timeout the default is six hours, which a hung browser install nearly spent.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check for internal references
        run: node scripts/check-internal-refs.js
      # THE PULL REQUEST BODY IS SCANNED TOO, and it is the surface this guard
      # was missing. The checker reads tracked files and, through the commit-msg
      # hook, commit messages. A pull request body is written in the GitHub UI:
      # it passes through neither, and it is the most public text of the three.
      # One shipped naming a private workspace file and sat there for eleven
      # days while every check stayed green. This comment deliberately does not
      # quote the sentence: doing so fails the very rule being described, which
      # is the check proving itself on the way in.
      #
      # The body is written to a file rather than interpolated into the run
      # script, so its contents are never parsed as shell.
      - name: Check the pull request body for internal references
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          node scripts/check-internal-refs.js --message "$RUNNER_TEMP/pr-body.txt"
      # Neither needs dependencies: both read the repo's own files.
      - name: Check for style drift
        run: node test/tools/style-drift.js

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Ceiling, not a wait. Observed maxima this session are far below it, so a
    # healthy run is unaffected and only a stuck one is cut short. Without any
    # timeout the default is six hours, which a hung browser install nearly spent.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        # The editor round-trip suite boots the real editor under jsdom.
        # Version must match package.json/package-lock.json.
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Run tests
        run: npm test

  # Type checking: JSDoc annotations + tsc --checkJs, zero build step.
  # Shapes (types.d.ts) plus every opted-in module must satisfy both configs
  # (server and client are separate so DOM globals never leak into server
  # code). Needs the full dev install, unlike the test jobs.
  typecheck:
    name: Typecheck (JSDoc + checkJs)
    runs-on: ubuntu-latest
    # Ceiling, not a wait. Observed maxima this session are far below it, so a
    # healthy run is unaffected and only a stuck one is cut short. Without any
    # timeout the default is six hours, which a hung browser install nearly spent.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (incl. dev, for tsc)
        run: npm ci

      - name: Run both type-check configs
        run: npm run typecheck

  # Guard mutation: each harness under test/tools/ breaks a guard on purpose and
  # requires a test to go red for it. A guard no test notices is not guarded.
  #
  # THREE JOBS, ONE REQUIRED CHECK. The plan decides which harnesses this
  # change can reach (scripts/mutation-scope.js, against the merge base), the
  # shards run them in parallel, and `Mutation guards` reads every shard's
  # verdict and reports one outcome. Only `Mutation guards` is meant to be a
  # required check: its name does not change with the shard count, and
  # `always()` keeps it from being skipped, which a required check would
  # otherwise count as passing.
  #
  # The complete set runs nightly, in mutation-nightly.yml, as the backstop for
  # what a scoped run cannot reach.
  mutation-plan:
    name: Mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # Full history: the base is a commit before this one, and the fixture
        # check reads the pre-change renderer out of history.
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      # THE BASE IS THE MERGE BASE. A pull request is checked out as GitHub's
      # merge commit, whose first parent is current main, so HEAD^1 is exactly
      # what the branch is compared against. A push to main is compared with
      # the commit it moved from; an all-zero or unreachable `before` (a new
      # branch, a force push) falls back to the first parent. A dispatched run
      # leaves the base to the script, which uses the merge base with main.
      - name: Choose the comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=''
          if [ "$EVENT" = "pull_request" ]; then
            base='HEAD^1'
          elif [ "$EVENT" = "push" ]; then
            if [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            else
              base='HEAD^1'
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Decide which harnesses this change can reach, and shard them
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            node scripts/mutation-scope.js --plan --out mutation-plan.json --base "$BASE"
          else
            node scripts/mutation-scope.js --plan --out mutation-plan.json
          fi

      - name: Keep the plan for the shards and the verdict
        uses: actions/upload-artifact@v7
        with:
          name: mutation-plan
          path: mutation-plan.json
          retention-days: 7

      # The frozen "before" fixture is the only record of how ordinary markdown
      # rendered before this work, and every claim that it is unchanged is taken
      # against it. This rebuilds it from the pre-change public/app.js and fails
      # if the committed bytes are not what that code produces.
      - name: Check the before fixture against the pre-change renderer
        run: npm run check:fixture

  mutation-shard:
    name: Mutation shard ${{ matrix.shard }}
    needs: mutation-plan
    if: needs.mutation-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # A shard is planned at about 200 rows, roughly ten minutes. Thirty bounds
    # a hang; a shard cut off here writes no verdict, which reads as no
    # verdict, never as a pass.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Fetch the plan
        uses: actions/download-artifact@v8
        with:
          name: mutation-plan

      - name: Remove each guard in this shard, and require a red test
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.count }}
        run: >-
          node scripts/mutation-scope.js --shard "$SHARD/$SHARDS"
          --plan-file mutation-plan.json --verdict "verdict-$SHARD.json"

      # The tools restore what they mutate, including when a run throws. A
      # shard that leaves any file modified is itself worth seeing.
      - name: Fail if any tool left a file modified
        run: git diff --exit-code

      - name: Keep this shard's verdict, whether it passed or not
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-verdict-${{ matrix.shard }}
          path: verdict-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

  mutation-guards:
    # The one mutation check to require on main. Do not rename it without
    # changing the branch protection setting and REQUIRED_CI_CHECKS in
    # scripts/release-ci.js in the same change.
    name: Mutation guards
    needs: [mutation-plan, mutation-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch the plan and every verdict
        if: needs.mutation-plan.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: mutation
          merge-multiple: true

      # Pass, fail, or no verdict. A shard that wrote no verdict (it died, was
      # cancelled or timed out) is no verdict for that shard. No verdict ends
      # this job non-green, titled "No verdict", so the merge stays blocked
      # without anyone being sent to look for a guard that failed.
      - name: One outcome from every shard
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
        run: >-
          node scripts/mutation-scope.js --aggregate
          --plan-file mutation/mutation-plan.json --verdicts mutation
          --plan-result "$PLAN_RESULT"

  # Coverage floors: the suite runs WITH coverage and the per-area floors in
  # test/tools/coverage-floors.json are enforced. Deleting a covered test, or
  # moving code without carrying its area definition, fails here. Floors
  # ratchet up, never down (--write-floors refuses to lower one).
  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    # Ceiling, not a wait. Observed maxima this session are far below it, so a
    # healthy run is unaffected and only a stuck one is cut short. Without any
    # timeout the default is six hours, which a hung browser install nearly spent.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Run suite with coverage and enforce floors
        run: npm run test:coverage

      # The floor gate names the tripped area but not the lines. The lcov is
      # the per-line evidence a floor investigation needs (load-repro +
      # lcov-diff is the standing method), so it ships as an artifact on
      # every run, pass or fail.
      - name: Upload lcov for floor diagnosis
        if: always()
        # v7 rather than v4: v4 targets Node 20, which the runners now force
        # onto Node 24 and warn about on every run. A warning nobody can act on
        # trains people to ignore the warnings that matter. The inputs used
        # here are unchanged across the majors between; what changed is
        # artifact merging and overwrite behaviour, neither of which this uses.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7
          if-no-files-found: ignore

  # E2E smoke suite (browser-driven, Playwright). Protects the client layer
  # the Node suite cannot observe: named regression tests for the two
  # escaped bugs (anchor re-flash, nav-state desync) plus palette golden
  # paths, and it measures public/app.js line coverage via V8.
  #
  # Promoted to BLOCKING 2026-07-14 (owner-approved, ahead of the planned
  # 2026-07-27 soak end): flake-free through the entire soak including ~15
  # runs on release day, and it pins three real escaped bugs (anchor
  # re-flash, nav-state desync, palette focus ring). ~20s runtime.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Ceiling, not a wait. Observed maxima this session are far below it, so a
    # healthy run is unaffected and only a stuck one is cut short. Without any
    # timeout the default is six hours, which a hung browser install nearly spent.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (incl. dev, for Playwright)
        # The full install runs network postinstalls (electron, ffmpeg-static)
        # that npm's own fetch retries do not cover; registry socket hang-ups
        # have killed this step three times. Retry the whole install with a
        # clean node_modules between attempts.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); cleaning and retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "npm ci failed on all 3 attempts"
          exit 1

      - name: Install Chromium
        # Retried on the same reasoning as the install step above, and for a
        # measured reason: this step hung twice on 2026-08-19, once for over
        # twenty minutes, with the job otherwise healthy. `--with-deps` shells
        # out to apt as well as fetching from the browser CDN, so it has two
        # independent ways to stall while the process stays alive.
        #
        # The per-attempt `timeout` is what makes the retry mean anything. A
        # bare retry loop around a HANG never reaches its second attempt: the
        # first one simply never returns. The job ceiling would eventually cut
        # it, but as a failure rather than a recovery.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then exit 0; fi
            echo "Chromium install failed or stalled (attempt $attempt); retrying in 15s"
            sleep 15
          done
          echo "Chromium install failed on all 3 attempts"
          exit 1

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Report client coverage
        if: always()
        run: |
          if [ -f test-results/coverage-client.lcov ]; then
            echo "client lcov written: test-results/coverage-client.lcov"
            grep -E "^(LF|LH):" test-results/coverage-client.lcov
          fi
