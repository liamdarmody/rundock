name: CI

# Runs the test suite on every push to main and every pull request, so no change
# to the server (a formerly untested ~4.3k-line monolith) merges without the
# regression net passing. --omit=dev installs just the runtime deps (ws) and
# skips the heavy Electron build toolchain; the editor round-trip suite runs
# the real Tiptap editor under jsdom, which is installed individually (pinned
# to the lockfile version) rather than pulling all devDependencies. Matrix
# covers the shipping Node (.nvmrc = 22, the packaged Electron runtime's Node
# line, and the floor for node:sqlite-backed search) and the dev runtime (24).

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs against any branch. Exists because push and pull_request
  # event processing has been observed to stall on GitHub's side while
  # dispatch kept working; this keeps full CI reachable for a branch when
  # that happens.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-free guard: no internal run codenames, review-round or
  # priority labels, or private workspace paths leak into the public source.
  hygiene:
    name: Hygiene (internal references, style drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check for internal references
        run: node scripts/check-internal-refs.js
      # Neither needs dependencies: both read the repo's own files.
      - name: Check for style drift
        run: node test/tools/style-drift.js

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        # The editor round-trip suite boots the real editor under jsdom.
        # Version must match package.json/package-lock.json.
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Run tests
        run: npm test

  # Type checking: JSDoc annotations + tsc --checkJs, zero build step.
  # Shapes (types.d.ts) plus every opted-in module must satisfy both configs
  # (server and client are separate so DOM globals never leak into server
  # code). Needs the full dev install, unlike the test jobs.
  typecheck:
    name: Typecheck (JSDoc + checkJs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (incl. dev, for tsc)
        run: npm ci

      - name: Run both type-check configs
        run: npm run typecheck

  # Coverage floors: the suite runs WITH coverage and the per-area floors in
  # test/tools/coverage-floors.json are enforced. Deleting a covered test, or
  # moving code without carrying its area definition, fails here. Floors
  # ratchet up, never down (--write-floors refuses to lower one).
  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Install test-only DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@29.1.1

      - name: Run suite with coverage and enforce floors
        run: npm run test:coverage

      # The floor gate names the tripped area but not the lines. The lcov is
      # the per-line evidence a floor investigation needs (load-repro +
      # lcov-diff is the standing method), so it ships as an artifact on
      # every run, pass or fail.
      - name: Upload lcov for floor diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7
          if-no-files-found: ignore

  # E2E smoke suite (browser-driven, Playwright). Protects the client layer
  # the Node suite cannot observe: named regression tests for the two
  # escaped bugs (anchor re-flash, nav-state desync) plus palette golden
  # paths, and it measures public/app.js line coverage via V8.
  #
  # Promoted to BLOCKING 2026-07-14 (owner-approved, ahead of the planned
  # 2026-07-27 soak end): flake-free through the entire soak including ~15
  # runs on release day, and it pins three real escaped bugs (anchor
  # re-flash, nav-state desync, palette focus ring). ~20s runtime.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (incl. dev, for Playwright)
        # The full install runs network postinstalls (electron, ffmpeg-static)
        # that npm's own fetch retries do not cover; registry socket hang-ups
        # have killed this step three times. Retry the whole install with a
        # clean node_modules between attempts.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); cleaning and retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "npm ci failed on all 3 attempts"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Report client coverage
        if: always()
        run: |
          if [ -f test-results/coverage-client.lcov ]; then
            echo "client lcov written: test-results/coverage-client.lcov"
            grep -E "^(LF|LH):" test-results/coverage-client.lcov
          fi
