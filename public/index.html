<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rundock</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/marked.min.js"></script>
<!-- d3-hierarchy: vendored locally (public/vendor/d3-hierarchy/) so the org chart works offline. -->
<script src="/vendor/d3-hierarchy/d3-hierarchy.min.js"></script>
<!-- highlight.js: vendored locally (public/vendor/highlight/) so code-block highlighting works offline. Light theme starts disabled; toggled with the app theme. -->
<link id="hljs-dark" rel="stylesheet" href="/vendor/highlight/atom-one-dark.min.css">
<link id="hljs-light" rel="stylesheet" href="/vendor/highlight/atom-one-light.min.css" disabled>
<script src="/vendor/highlight/highlight.min.js"></script>
<script src="/code-language.js"></script>
<script src="/chrome-insets.js"></script>
<script src="/theme-choice.js"></script>
<script src="/update-strip-view.js"></script>
<script src="/empty-list.js"></script>
<script src="/unread-state.js"></script>
<script src="/markers.js"></script>
<script src="/permissions.js"></script>
<script src="/conversation-list.js"></script>
<script src="/palette-model.js"></script>
<script src="/files-menu-model.js"></script>
<script src="/external-refresh-model.js"></script>
<script src="/conversation-state.js"></script>
<script src="/chat-markup.js"></script>
<script src="/markdown-render.js"></script>
<script src="/file-tree-diff.js"></script>
<script src="/routine-editor-model.js"></script>
<script src="/run-detail-model.js"></script>
<script src="/skills-model.js"></script>
<script src="/routines-model.js"></script>
<script src="/routines-scope-model.js"></script>
<script src="/guide-copy.js"></script>
<!-- Tokens first: everything below resolves var(--x) against this file. -->
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/fonts.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/components/topbar.css">
<link rel="stylesheet" href="/styles/components/nav-rail.css">
<link rel="stylesheet" href="/styles/components/sidebar.css">
<link rel="stylesheet" href="/styles/components/update-strip.css">
<link rel="stylesheet" href="/styles/components/floating-toolbar.css">
<link rel="stylesheet" href="/styles/components/find-bar.css">
<link rel="stylesheet" href="/styles/components/message-content.css">
<link rel="stylesheet" href="/styles/components/connection-bar.css">
<link rel="stylesheet" href="/styles/components/palette.css">
<link rel="stylesheet" href="/styles/views/org-chart.css">
<link rel="stylesheet" href="/styles/views/profile.css">
<link rel="stylesheet" href="/styles/views/chat.css">
<link rel="stylesheet" href="/styles/views/editor.css">
<link rel="stylesheet" href="/styles/views/skills.css">
<link rel="stylesheet" href="/styles/views/settings.css">
<link rel="stylesheet" href="/styles/views/workspace.css">
<link rel="stylesheet" href="/styles/views/conversations.css">
<link rel="stylesheet" href="/styles/views/routine-editor.css">
<link rel="stylesheet" href="/styles/views/run-detail.css">
<link rel="stylesheet" href="/styles/views/routines.css">
</head>
<body>
<div class="app">
  <!-- The top bar renders in EVERY state, including the workspace picker.
       This is not cosmetic: once the OS title bar is removed, this bar carries
       the only drag region, so gating it the way the rail and sidebar are
       gated would leave a first-run user with a window they cannot move.
       Only the search field is conditional, since there is nothing to search
       before a workspace is open. Help is most useful precisely here. -->
  <div class="topbar" id="topbar">
    <button class="tb-search" id="tb-search" style="display:none" onclick="openPalette()" aria-label="Search workspace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search workspace</span>
      <span class="tb-kbd" id="tb-search-kbd"></span>
    </button>
    <div class="tb-right">
      <button class="tb-btn" id="tb-help" data-tooltip="Help and docs" aria-label="Help and docs" onclick="openDocs()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </div>

  <div class="app-body">
  <nav class="nav-rail" style="display:none">
    <div class="nav-main">
      <button class="nav-item active" data-nav="conversations" onclick="switchNav('conversations')" data-tooltip="Conversations">
        <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="nav-item" data-nav="team" onclick="switchNav('team')" data-tooltip="Team">
        <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14 21H2v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2z"/><circle cx="8" cy="7" r="4"/><path d="M22 21h-4v-2a5.97 5.97 0 0 0-1.5-4h.5a3 3 0 0 1 3 3v3z"/><circle cx="17" cy="7.5" r="3"/></svg>
      </button>
      <button class="nav-item" data-nav="skills" onclick="switchNav('skills')" data-tooltip="Skills">
        <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </button>
      <!-- Routines. Permanent, like every other entry. The rail names what the
           app can do: a map of places, always the same size, so a user learns
           it once. What a place holds is that place's own business, and an
           empty place says what it is for. -->
      <button class="nav-item" data-nav="routines" onclick="switchNav('routines')" data-tooltip="Routines">
        <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v4.4l3.3 2a1 1 0 1 1-1 1.7l-3.8-2.3a1 1 0 0 1-.5-.9V7a1 1 0 0 1 2 0z"/></svg>
      </button>
      <button class="nav-item" data-nav="files" onclick="switchNav('files')" data-tooltip="Files">
        <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <!-- Search moved to the top bar. Two affordances for one overlay is what
           made search feel hidden in the first place, so the rail no longer
           carries a magnifier. The shortcut hint moved with it, and lives
           inline in the field rather than in a tooltip you had to hover to
           find. Cmd+K / Ctrl+K is unchanged. -->
    </div>
    <div class="nav-bottom">
      <button class="nav-item" onclick="toggleTheme()" data-tooltip="Theme" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="nav-item" data-nav="settings" onclick="switchNav('settings')" data-tooltip="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </nav>

  <aside class="sidebar" style="display:none">
    <div id="sidebar-team" class="hidden">
      <div class="sidebar-header" id="sidebar-team-header"><span class="sidebar-label">Your Team</span></div>
      <div class="agent-status-list" id="agent-list"></div>
    </div>
    <!-- The routines panel is a sidebar in its own right, and it was not. It
         was a child of the team panel above, revealed by mapping the routines
         rail entry onto that panel, which made the two sidebars one element
         rather than two that resembled each other. So this panel could say
         nothing about the list beside it and listed every routine a second
         time in less detail than the pane already showed.

         Its contents are SCOPES, not agents: only agents that own a routine,
         with All routines pinned first and never removed. Drawn by
         views/routines-panel.js, which owns the scope the list is filtered by
         and the scope the header plus inherits. -->
    <div id="sidebar-routines" class="hidden"></div>
    <div id="sidebar-conversations">
      <div class="sidebar-header"><span class="sidebar-label">Conversations</span></div>
      <div class="sidebar-pills" id="sidebar-pills">
        <button class="pill active" id="pill-all" onclick="setSidebarPill('all')">All</button>
        <button class="pill" id="pill-unread" onclick="setSidebarPill('unread')">Unread</button>
      </div>
      <div class="convo-list" id="convo-list"></div>
    </div>
    <div id="sidebar-skills" class="hidden">
      <div class="sidebar-header"><span class="sidebar-label">Skills</span></div>
      <div class="skills-sidebar-list" id="skills-sidebar-list"></div>
    </div>
    <div id="sidebar-files" class="hidden">
      <div class="sidebar-header"><span class="sidebar-label">Files</span><button class="files-add-btn" id="files-add-btn" title="New…" onclick="openCreateMenu(this, '')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button></div>
      <div class="file-tree" id="file-tree"></div>
    </div>
    <div id="sidebar-settings" class="hidden">
      <div class="sidebar-header"><span class="sidebar-label">Settings</span></div>
      <div class="settings-nav">
        <div class="settings-nav-item active" data-settings="workspace" onclick="showSettingsSection('workspace')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Workspace
        </div>
        <div class="settings-nav-item" data-settings="appearance" onclick="showSettingsSection('appearance')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Appearance
        </div>
        <div class="settings-nav-item" data-settings="about" onclick="showSettingsSection('about')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          About
        </div>
      </div>
    </div>
    <div id="update-strip" class="u-strip" style="display:none"></div>
    <!-- Sidebar-level so the update strip can sit ABOVE it: the strip
         appearing or expanding consumes list space, and this button never
         moves. Shown only on the Conversations tab (setNavState). -->
    <div class="convo-footer" id="convo-footer">
      <button class="add-btn" onclick="newConversation()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New conversation</button>
    </div>
  </aside>

  <main class="main">
    <div class="connection-bar connecting" id="connection-bar">Connecting...</div>
    <!-- In-view find bar. Cmd+F (Ctrl+F) opens it for whichever view is
         active: conversation, markdown editor, or legacy file preview.
         Positioned absolutely in the top-right of the main panel area. -->
    <div id="find-bar" class="find-bar hidden" role="search" aria-label="Find in view">
      <input id="find-input" type="text" placeholder="Find" autocomplete="off" spellcheck="false" />
      <span id="find-count" class="find-count"></span>
      <button id="find-prev" class="find-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button id="find-next" class="find-btn" title="Next match (Enter)" aria-label="Next match">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button id="find-close" class="find-btn" title="Close (Esc)" aria-label="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <!-- Workspace picker -->
    <div id="view-workspace" class="hidden view-panel view-scroll" style="align-items:center;padding:32px">
      <div style="max-width:480px;width:100%;text-align:center;margin:auto 0">
        <div class="ws-picker-title">Rundock</div>
        <div class="ws-picker-subtitle">Open a workspace to get started</div>
        <div id="workspace-recent" style="margin-bottom:24px"></div>
        <div id="workspace-discovered" style="margin-bottom:24px"></div>
        <div class="ws-picker-divider">
          <span class="ws-picker-or">or</span>
          <div id="ws-picker-buttons" class="ws-picker-btn-row">
            <button id="create-workspace-btn" class="ws-picker-create-btn" onclick="showCreateForm()">New workspace</button>
            <button id="open-folder-btn" class="ws-picker-open-btn" onclick="openFolder()">Open folder</button>
          </div>
          <div id="create-workspace-form" style="display:none;width:100%">
            <div style="display:flex;gap:8px;align-items:center">
              <input id="create-workspace-name" class="ws-picker-input" type="text" placeholder="Workspace name...">
              <button class="ws-picker-submit" onclick="createWorkspace()">Create</button>
            </div>
            <div class="ws-picker-hint">Creates ~/Documents/Rundock/&lt;name&gt;</div>
          </div>
          <div id="workspace-error" class="ws-picker-error"></div>
        </div>
      </div>
    </div>
    <!-- Home: org chart -->
    <div id="view-home" class="hidden view-panel" style="display:none"><div class="org-chart" id="org-chart"></div></div>
    <!-- Agent profile -->
    <div id="view-profile" class="hidden view-panel"><div class="profile" id="profile-content"></div></div>
    <!-- Conversations empty -->
    <div id="view-convo-empty" class="hidden view-panel view-centered">
      <svg class="empty-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <div id="convo-empty-label" class="empty-title">Start a conversation</div>
      <div id="convo-empty-content"></div>
    </div>
    <!-- Chat -->
    <div id="view-chat" class="hidden view-panel">
      <div class="chat-header">
        <div class="avatar sm" id="chat-agent-avatar"></div>
        <div style="flex:1;min-width:0">
          <input id="chat-title-input" class="chat-title-input" spellcheck="false" value="New conversation" onchange="renameConversation(this.value)">
          <div style="font-size:var(--caption);color:var(--text-2);display:flex;align-items:center;gap:6px" id="chat-agent-row">
            <span id="chat-agent-label"></span>
            <span class="chat-status" id="chat-status"></span>
          </div>
        </div>
        <span class="chat-convo-status" id="chat-convo-status" onclick="toggleConvoStatus()"><span class="state-label">Active</span><span class="action-label">→ Archive</span></span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <textarea id="msg-input" placeholder="Message..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </div>
    <!-- Skills -->
    <div id="view-skills" class="hidden view-panel">
      <div class="profile" id="skill-detail-content">
      </div>
    </div>
    <!-- Editor -->
    <div id="view-editor" class="hidden view-panel">
      <div class="editor-header hidden" id="editor-header">
        <a class="chat-back" id="editor-back" onclick="editorGoBack()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
        <span class="editor-filename" id="editor-filename"></span>
        <span class="editor-status" id="editor-status"></span>
        <button class="editor-toggle active" id="toggle-preview" onclick="setEditorMode('preview')">Preview</button>
        <button class="editor-toggle" id="toggle-edit" onclick="setEditorMode('edit')">Edit</button>
      </div>
      <div id="editor-empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"></div>
      <div class="editor-content formatted hidden" id="editor-content"></div>
      <textarea class="editor-content source hidden" id="editor-textarea"></textarea>
      <!-- Tiptap editor pane: holds properties panel, editor mount, floating
           toolbar. Hidden by default; app.js shows it for markdown files and
           hides it (showing the legacy preview/edit pane instead) for
           non-markdown files. -->
      <div id="tiptap-editor-pane" class="tiptap-editor-pane hidden">
        <div id="tiptap-properties" class="properties"></div>
        <div id="tiptap-editor" class="tiptap-editor"></div>
        <div id="tiptap-toolbar" class="floating-toolbar"></div>
      </div>
    </div>
    <!-- Routine editor: pick a skill, then say when it runs. -->
    <!-- Routines -->
    <div id="view-routines" class="hidden view-panel view-scroll">
      <div class="routines-content" id="routines-content"></div>
    </div>
    <div id="view-routine-editor" class="hidden view-panel view-scroll">
      <div class="routine-editor" id="routine-editor-content"></div>
    </div>
    <!-- Run detail: what one run did, read from its own record. -->
    <div id="view-run-detail" class="hidden view-panel view-scroll">
      <div class="run-detail" id="run-detail-content"></div>
    </div>
    <!-- Settings -->
    <div id="view-settings" class="hidden view-panel view-scroll">
      <div class="settings-content" id="settings-content"></div>
    </div>
  </main>
  </div><!-- /.app-body -->
</div>

<!-- Universal search palette (Cmd+K / Ctrl+K) -->
<div id="palette-overlay" class="palette-overlay hidden" onmousedown="if(event.target===this)closePalette()">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search workspace">
    <div class="palette-input-row">
      <svg class="palette-glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="palette-input" class="palette-input" placeholder="Search files, conversations, agents, skills..." autocomplete="off" spellcheck="false" role="combobox" aria-label="Search workspace" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list" />
    </div>
    <div class="palette-scope-row" id="palette-scope-row" role="tablist" aria-label="Result type">
      <button class="palette-scope active" data-scope="all" onclick="setPaletteScope('all')">All</button>
      <button class="palette-scope" data-scope="files" onclick="setPaletteScope('files')">Files</button>
